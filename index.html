<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        <input type="number" id="id" name="id"></input>
        <br><br>

        <select id="food">

            <option value="Pizza">Pizza</option>
            <option value="Chicken Patty">Chicken Patty</option>
        </select>
        <br><br>
        <button>Submit</button>
    </form>

    <br>
    
    <h1>Current Orders</h1>

    <div>
        <h2>Name: Nicholas Lyons</h3>

        body
        {
            background-color: indianred;
        }

        body label
        {
            font-size: 1.75em;
            color: black;
            font-weight: bold;
        }
        
        body input
        {
